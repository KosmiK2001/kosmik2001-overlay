<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Эмодзи в Viber: Qt 6.10.2, бандловый с Viber, не рисует COLRv1 —
  вместо смайлов квадраты/кракозябры (flathub/com.viber.Viber PR#121).
  Отбиваем COLRv1-вариант Noto Color Emoji; CBDT-версия
  (/usr/share/fonts/noto-emoji/NotoColorEmoji.ttf из
  media-fonts/noto-emoji-20250912 без -r1) остаётся и рисуется нормально.

  Подключается ТОЛЬКО когда в /etc/viber/viber.conf стоит VIBER_EMOJI_FIX=1
  (обёртка /usr/bin/viber ставит FONTCONFIG_FILE на этот файл).
-->
<fontconfig>
	<include ignore_missing="yes">/etc/fonts/fonts.conf</include>

	<selectfont>
		<rejectfont>
			<glob>/usr/share/fonts/*Noto-COLRv1*.ttf</glob>
		</rejectfont>
	</selectfont>
</fontconfig>
